# Fly.io config. Change "app" to your own unique app name (see docs/DEPLOY.md).
app = "pureun-pharmacy-CHANGE-ME"
primary_region = "nrt" # Tokyo

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  DB_PATH = "/data/pharmacy.db"
  SECURE_COOKIE = "1"
  TRUST_PROXY = "1"

# Persistent volume for the SQLite file
[mounts]
  source = "pharmacy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle, wakes on request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
