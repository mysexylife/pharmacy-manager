# 코드가 이 브랜치에 올라오면 자동으로 시험(npm test)을 돌리고, 통과하면 Fly.io 서버에 배포한다.
# 필요한 설정: GitHub 저장소 Settings > Secrets and variables > Actions 에 FLY_API_TOKEN 등록
#   (토큰 만들기: fly tokens create deploy -a vnfmsdirrnr-1102)
name: Fly Deploy

on:
  push:
    branches: [claude/epic-ride-xkr14e]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false -a vnfmsdirrnr-1102
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
